<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل طالب جديد</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
    .form-container { max-width: 500px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
    button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #218838; }
    .alert { padding: 10px; border-radius: 5px; margin-bottom: 15px; display: none; text-align: center; }
    .alert-success { background-color: #d4edda; color: #155724; }
    .alert-danger { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

<div class="form-container">
  <h2>استمارة تسجيل طالب جديد</h2>
  <div id="statusMsg" class="alert"></div>

  <form id="registrationForm">
    <div class="form-group">
      <label>اسم الطالب رباعياً:</label>
      <input type="text" id="studentName" required placeholder="أدخل اسم الطالب الكامل">
    </div>

    <div class="form-group">
      <label>الصف الدراسي:</label>
      <select id="studentGrade" required>
        <option value="">اختر الصف</option>
        <option value="الأول الابتدائي">الأول الابتدائي</option>
        <option value="الثاني الابتدائي">الثاني الابتدائي</option>
        <option value="الثالث الابتدائي">الثالث الابتدائي</option>
        <option value="الرابع الابتدائي">الرابع الابتدائي</option>
        <option value="الخامس الابتدائي">الخامس الابتدائي</option>
        <option value="السادس الابتدائي">السادس الابتدائي</option>
        <option value="السابع الأساسي">السابع الأساسي</option>
        <option value="الثامن الأساسي">الثامن الأساسي</option>
        <option value="التاسع الأساسي">التاسع الأساسي</option>
        <option value="الأول الثانوي">الأول الثانوي</option>
        <option value="الثاني الثانوي">الثاني الثانوي</option>
        <option value="الثالث الثانوي">الثالث الثانوي</option>
      </select>
    </div>

    <div class="form-group">
      <label>عنوان السكن:</label>
      <input type="text" id="address" required placeholder="المنطقة / الشارع">
    </div>

    <div class="form-group">
      <label>رقم هاتف التواصل:</label>
      <input type="tel" id="phone" required placeholder="77XXXXXXX">
    </div>

    <button type="submit" id="submitBtn">إرسال طلب التسجيل</button>
  </form>
</div>

<!-- مكتبة Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
