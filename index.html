<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أكاديمية النبلاء</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans p-4">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center text-blue-700 mb-6">منصة أكاديمية النبلاء التعليمية</h1>
        
        <!-- أزرار التنقل بين الحسابات -->
        <div class="flex justify-around mb-6 border-b pb-4">
            <button onclick="showTab('admin')" class="font-bold text-blue-600">الإدارة</button>
            <button onclick="showTab('teacher')" class="font-bold text-gray-600">المعلم</button>
            <button onclick="showTab('student')" class="font-bold text-gray-600">الطالب / ولي الأمر</button>
        </div>

        <!-- 1. لوحة الإدارة -->
        <div id="admin" class="tab-content space-y-4">
            <h2 class="font-bold text-lg">إضافة طالب جديد</h2>
            <input type="text" id="addCode" placeholder="كود الطالب (مثال: NBL-2026-001)" class="w-full p-2 border rounded">
            <input type="text" id="addName" placeholder="اسم الطالب الرباعي" class="w-full p-2 border rounded">
            <input type="text" id="addGrade" placeholder="الصف الدراسي" class="w-full p-2 border rounded">
            <input type="text" id="addPhone" placeholder="رقم ولي الأمر" class="w-full p-2 border rounded">
            <button onclick="addStudent()" class="w-full bg-blue-600 text-white p-2 rounded font-bold">حفظ الطالب</button>
        </div>

        <!-- 2. حساب المعلم -->
        <div id="teacher" class="tab-content hidden space-y-4">
            <h2 class="font-bold text-lg">رصد الحضور والدرجات</h2>
            <input type="text" id="tCode" placeholder="كود الطالب" class="w-full p-2 border rounded">
            <input type="text" id="tSubject" placeholder="المادة" class="w-full p-2 border rounded">
            <input type="number" id="tScore" placeholder="الدرجة" class="w-full p-2 border rounded">
            <select id="tStatus" class="w-full p-2 border rounded">
                <option value="حاضر">حاضر</option>
                <option value="غائب">غائب</option>
            </select>
            <button onclick="saveRecord()" class="w-full bg-green-600 text-white p-2 rounded font-bold">رصد البيان</button>
        </div>

        <!-- 3. حساب الطالب وولي الأمر -->
        <div id="student" class="tab-content hidden space-y-4">
            <h2 class="font-bold text-lg">متابعة ملف الطالب</h2>
            <input type="text" id="sCode" placeholder="أدخل كود الطالب (NBL-2026-001)" class="w-full p-2 border rounded">
            <button onclick="fetchStudent()" class="w-full bg-indigo-600 text-white p-2 rounded font-bold">عرض التقرير</button>
            <div id="studentReport" class="p-4 bg-gray-50 border rounded hidden"></div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://axhddoktuhjhscevstbr.supabase.co';
        const supabaseKey = 'sb_publishable_3D1Z7yd_R7r_VkvmYjo3ng_oe2VmNG_';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
        }

        async function addStudent() {
            const code = document.getElementById('addCode').value;
            const name = document.getElementById('addName').value;
            const grade = document.getElementById('addGrade').value;
            const phone = document.getElementById('addPhone').value;

            const { error } = await supabase.from('student').insert([{ student_code: code, full_name: name, grade_level: grade, parent_phone: phone }]);
            if (error) alert('خطأ في الحفظ: ' + error.message);
            else alert('تمت إضافة الطالب بنجاح!');
        }

        async function fetchStudent() {
            const code = document.getElementById('sCode').value;
            const { data, error } = await supabase.from('student').select('*').eq('student_code', code).single();
            const report = document.getElementById('studentReport');
            if (data) {
                report.classList.remove('hidden');
                report.innerHTML = `<p><b>الاسم:</b> ${data.full_name}</p><p><b>الصف:</b> ${data.grade_level}</p><p><b>رقم ولي الأمر:</b> ${data.parent_phone}</p>`;
            } else {
                alert('لم يتم العثور على الطالب');
            }
        }
    </script>
</body>
</html>
