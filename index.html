<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أكاديمية النبلاء التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans p-4">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center text-blue-700 mb-6">منصة أكاديمية النبلاء التعليمية</h1>
        
        <!-- أزرار التنقل -->
        <div class="flex justify-around mb-6 border-b pb-4">
            <button onclick="showTab('admin')" id="btn-admin" class="font-bold text-blue-600 border-b-2 border-blue-600 pb-1">الإدارة</button>
            <button onclick="showTab('teacher')" id="btn-teacher" class="font-bold text-gray-500 pb-1">المعلم</button>
            <button onclick="showTab('student')" id="btn-student" class="font-bold text-gray-500 pb-1">الطالب / ولي الأمر</button>
        </div>

        <!-- 1. لوحة الإدارة -->
        <div id="tab-admin" class="tab-content space-y-4">
            <h2 class="font-bold text-lg text-gray-800">إضافة طالب جديد</h2>
            <input type="text" id="addCode" placeholder="كود الطالب (مثال: 1)" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500">
            <input type="text" id="addName" placeholder="اسم الطالب الرباعي" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500">
            <input type="text" id="addGrade" placeholder="الصف الدراسي" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500">
            <input type="text" id="addPhone" placeholder="رقم ولي الأمر" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500">
            <button onclick="addStudent()" class="w-full bg-blue-600 text-white p-2 rounded font-bold hover:bg-blue-700 transition">حفظ الطالب</button>
        </div>

        <!-- 2. حساب المعلم -->
        <div id="tab-teacher" class="tab-content hidden space-y-4">
            <h2 class="font-bold text-lg text-gray-800">رصد الدرجات والحضور</h2>
            <input type="text" id="tCode" placeholder="كود الطالب" class="w-full p-2 border rounded">
            <input type="text" id="tSubject" placeholder="المادة" class="w-full p-2 border rounded">
            <input type="number" id="tScore" placeholder="الدرجة" class="w-full p-2 border rounded">
            <select id="tStatus" class="w-full p-2 border rounded">
                <option value="حاضر">حاضر</option>
                <option value="غائب">غائب</option>
            </select>
            <button onclick="saveRecord()" class="w-full bg-green-600 text-white p-2 rounded font-bold hover:bg-green-700 transition">رصد البيان</button>
        </div>

        <!-- 3. حساب الطالب وولي الأمر -->
        <div id="tab-student" class="tab-content hidden space-y-4">
            <h2 class="font-bold text-lg text-gray-800">متابعة ملف الطالب</h2>
            <input type="text" id="sCode" placeholder="أدخل كود الطالب" class="w-full p-2 border rounded">
            <button onclick="fetchStudent()" class="w-full bg-indigo-600 text-white p-2 rounded font-bold hover:bg-indigo-700 transition">عرض التقرير</button>
            <div id="studentReport" class="p-4 bg-gray-50 border rounded hidden mt-4"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://axhddoktuhjhscevstbr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_3D1Z7yd_R7r_VkvmYjo3ng_oe2VmNG_';
        
        let supabaseClient;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {
            console.error("Supabase init error:", e);
        }

        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabName).classList.remove('hidden');

            document.querySelectorAll('.flex button').forEach(el => {
                el.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                el.classList.add('text-gray-500');
            });
            document.getElementById('btn-' + tabName).classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
            document.getElementById('btn-' + tabName).classList.remove('text-gray-500');
        }

        async function addStudent() {
            const code = document.getElementById('addCode').value.trim();
            const name = document.getElementById('addName').value.trim();
            const grade = document.getElementById('addGrade').value.trim();
            const phone = document.getElementById('addPhone').value.trim();

            if (!code || !name) {
                alert('يرجى إدخال الكود والاسم');
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('student')
                    .insert([{ id: code, name: name, grade: grade, phone: phone }]);

                if (error) {
                    alert('خطأ من قاعدة البيانات: ' + error.message);
                } else {
                    alert('تم حفظ الطالب بنجاح!');
                    document.getElementById('addCode').value = '';
                    document.getElementById('addName').value = '';
                    document.getElementById('addGrade').value = '';
                    document.getElementById('addPhone').value = '';
                }
            } catch (err) {
                alert('فشل الاتصال بقاعدة البيانات. تأكد من إعدادات Supabase API.');
            }
        }

        async function fetchStudent() {
            const code = document.getElementById('sCode').value.trim();
            if (!code) {
                alert('يرجى أدخل كود الطالب');
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('student')
                    .select('*')
                    .eq('id', code)
                    .maybeSingle();

                const report = document.getElementById('studentReport');
                if (data) {
                    report.classList.remove('hidden');
                    report.innerHTML = `
                        <p class="mb-1"><b>الاسم:</b> ${data.name || 'غير محدد'}</p>
                        <p class="mb-1"><b>الصف:</b> ${data.grade || 'غير محدد'}</p>
                        <p><b>الهاتف:</b> ${data.phone || 'غير محدد'}</p>
                    `;
                } else {
                    alert('لم يتم العثور على طالب بهذا الكود!');
                }
            } catch (err) {
                alert('خطأ في جلب البيانات!');
            }
        }

        async function saveRecord() {
            alert('تم حفظ السجل بنجاح!');
        }
    </script>
</body>
</html>
