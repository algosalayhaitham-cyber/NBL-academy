<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أكاديمية النبلاء التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* إخفاء عناصر التحكم والأزرار عند حفظ أو طباعة الـ PDF */
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white;
                padding: 0;
            }
            .shadow-lg {
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans p-4">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center text-blue-700 mb-6">منصة أكاديمية النبلاء التعليمية</h1>
        
        <!-- أزرار التنقل -->
        <div class="flex justify-around mb-6 border-b pb-4 no-print">
            <button onclick="showTab('admin')" id="btn-admin" class="font-bold text-blue-600 border-b-2 border-blue-600 pb-1">الإدارة</button>
            <button onclick="showTab('teacher')" id="btn-teacher" class="font-bold text-gray-500 pb-1">المعلم</button>
            <button onclick="showTab('student')" id="btn-student" class="font-bold text-gray-500 pb-1">الطالب / ولي الأمر</button>
        </div>

        <!-- 1. لوحة الإدارة -->
        <div id="tab-admin" class="tab-content space-y-4">
            <h2 class="font-bold text-lg text-gray-800 no-print">إضافة طالب جديد</h2>
            <input type="text" id="addCode" placeholder="كود الطالب (مثال: 1)" class="w-full p-2 border rounded no-print">
            <input type="text" id="addName" placeholder="اسم الطالب الرباعي" class="w-full p-2 border rounded no-print">
            <input type="text" id="addGrade" placeholder="الصف الدراسي" class="w-full p-2 border rounded no-print">
            <input type="text" id="addPhone" placeholder="رقم ولي الأمر" class="w-full p-2 border rounded no-print">
            <button onclick="addStudent()" class="w-full bg-blue-600 text-white p-2 rounded font-bold hover:bg-blue-700 transition no-print">حفظ الطالب</button>

            <!-- زر عرض وقائمة جميع الطلاب للطباعة -->
            <hr class="my-4 no-print">
            <div class="flex justify-between items-center no-print">
                <button onclick="loadAllStudents()" class="bg-gray-800 text-white px-4 py-2 rounded font-bold hover:bg-gray-900">عرض كشف جميع الطلاب</button>
                <button onclick="window.print()" class="bg-red-600 text-white px-4 py-2 rounded font-bold hover:bg-red-700">تصدير / حفظ PDF 📄</button>
            </div>
            
            <div id="allStudentsTable" class="mt-4 hidden">
                <h3 class="font-bold text-md mb-2 text-center text-gray-800">كشف أسماء الطلاب المسجلين</h3>
                <table class="w-full border-collapse border border-gray-300 text-right text-sm">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="border border-gray-300 p-2">الكود</th>
                            <th class="border border-gray-300 p-2">الاسم</th>
                            <th class="border border-gray-300 p-2">الصف</th>
                            <th class="border border-gray-300 p-2">الهاتف</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 2. حساب المعلم -->
        <div id="tab-teacher" class="tab-content hidden space-y-4 no-print">
            <h2 class="font-bold text-lg text-gray-800">رصد الدرجات والحضور</h2>
            <input type="text" id="tCode" placeholder="كود الطالب" class="w-full p-2 border rounded">
            <button onclick="saveRecord()" class="w-full bg-green-600 text-white p-2 rounded font-bold">رصد البيان</button>
        </div>

        <!-- 3. حساب الطالب وولي الأمر -->
        <div id="tab-student" class="tab-content hidden space-y-4">
            <h2 class="font-bold text-lg text-gray-800 no-print">متابعة ملف الطالب</h2>
            <input type="text" id="sCode" placeholder="أدخل كود الطالب" class="w-full p-2 border rounded no-print">
            <button onclick="fetchStudent()" class="w-full bg-indigo-600 text-white p-2 rounded font-bold no-print">عرض التقرير</button>
            
            <div id="studentReport" class="p-4 bg-gray-50 border rounded hidden mt-4"></div>
            <button id="btnPrintReport" onclick="window.print()" class="w-full bg-red-600 text-white p-2 rounded font-bold hidden no-print">حفظ التقرير PDF 📄</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://axhddoktuhjhscovstbr.supabase.co';
        const supabaseKey = 'sb_publishable_3D1Z7yd_R7r_VkvmYjo3ng_oe2VmNG_';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabName).classList.remove('hidden');

            document.querySelectorAll('.flex button').forEach(el => {
                el.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                el.classList.add('text-gray-500');
            });
            document.getElementById('btn-' + tabName).classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
            document.getElementById('btn-' + tabName).classList.remove('text-gray-500');
        }

        async function addStudent() {
            const code = document.getElementById('addCode').value.trim();
            const name = document.getElementById('addName').value.trim();
            const grade = document.getElementById('addGrade').value.trim();
            const phone = document.getElementById('addPhone').value.trim();

            if (!code || !name) {
                alert('يرجى إدخال الكود والاسم');
                return;
            }

            const { data, error } = await supabaseClient
                .from('student')
                .insert([{ id: code, name: name, grade: grade, phone: phone }]);

            if (error) {
                alert('حدث خطأ أثناء الحفظ: ' + error.message);
            } else {
                alert('تم حفظ الطالب بنجاح!');
                document.getElementById('addCode').value = '';
                document.getElementById('addName').value = '';
                document.getElementById('addGrade').value = '';
                document.getElementById('addPhone').value = '';
            }
        }

        async function loadAllStudents() {
            const { data, error } = await supabaseClient
                .from('student')
                .select('*');

            if (error) {
                alert('خطأ في جلب البيانات: ' + error.message);
                return;
            }

            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '';

            if (data && data.length > 0) {
                data.forEach(s => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="border border-gray-300 p-2">${s.id || ''}</td>
                            <td class="border border-gray-300 p-2">${s.name || ''}</td>
                            <td class="border border-gray-300 p-2">${s.grade || ''}</td>
                            <td class="border border-gray-300 p-2">${s.phone || ''}</td>
                        </tr>
                    `;
                });
                document.getElementById('allStudentsTable').classList.remove('hidden');
            } else {
                alert('لا يوجد طلاب مسجلون بعد');
            }
        }

        async function fetchStudent() {
            const code = document.getElementById('sCode').value.trim();
            if (!code) { alert('يرجى إدخال كود الطالب'); return; }

            const { data, error } = await supabaseClient
                .from('student')
                .select('*')
                .eq('id', code)
                .maybeSingle();

            const report = document.getElementById('studentReport');
            const btnPrint = document.getElementById('btnPrintReport');

            if (data) {
                report.classList.remove('hidden');
                btnPrint.classList.remove('hidden');
                report.innerHTML = `
                    <p class="mb-1"><b>الكود:</b> ${data.id}</p>
                    <p class="mb-1"><b>الاسم:</b> ${data.name || 'غير محدد'}</p>
                    <p class="mb-1"><b>الصف:</b> ${data.grade || 'غير محدد'}</p>
                    <p><b>الهاتف:</b> ${data.phone || 'غير محدد'}</p>
                `;
            } else {
                alert('لم يتم العثور على طالب بهذا الكود!');
                report.classList.add('hidden');
                btnPrint.classList.add('hidden');
            }
        }

        function saveRecord() { alert('تم حفظ السجل بنجاح!'); }
    </script>
</body>
</html>
