<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية نبلاء اليمن الأهلية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .shadow-lg { box-shadow: none !important; }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans p-2 sm:p-4">
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg p-4 sm:p-6">
        
        <!-- الهيدر وشعار الأكاديمية -->
        <div class="flex flex-col items-center border-b pb-4 mb-6 text-center">
            <img src="file_000000005338820aad78414dae5cb9eb.png" alt="شعار أكاديمية نبلاء اليمن الأهلية" class="w-28 h-28 object-contain mb-2 rounded-full shadow-sm">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-blue-900">أكاديمية نبلاء اليمن الأهلية</h1>
            <p class="text-sm font-semibold text-amber-600 mt-1">نبني أساساً... نصنع مستقبلاً</p>
        </div>
        
        <!-- أزرار التنقل الرئيسية -->
        <div class="flex justify-around mb-6 border-b pb-4 no-print text-sm sm:text-base">
            <button onclick="showTab('admin')" id="btn-admin" class="font-bold text-blue-600 border-b-2 border-blue-600 pb-1">الإدارة</button>
            <button onclick="showTab('teacher')" id="btn-teacher" class="font-bold text-gray-500 pb-1">المعلم</button>
            <button onclick="showTab('student')" id="btn-student" class="font-bold text-gray-500 pb-1">الطالب / ولي الأمر</button>
        </div>

        <!-- ==================== 1. لوحة الإدارة ==================== -->
        <div id="tab-admin" class="tab-content space-y-6">
            <!-- إضافة طالب -->
            <div class="bg-blue-50 p-4 rounded-lg border border-blue-200 no-print space-y-3">
                <h2 class="font-bold text-lg text-blue-900">إضافة طالب جديد</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <input type="text" id="addCode" placeholder="كود الطالب (مثال: 101)" class="p-2 border rounded">
                    <input type="text" id="addName" placeholder="اسم الطالب الرباعي" class="p-2 border rounded">
                    <input type="text" id="addGrade" placeholder="الصف الدراسي" class="p-2 border rounded">
                    <input type="text" id="addPhone" placeholder="رقم ولي الأمر" class="p-2 border rounded">
                </div>
                <button onclick="addStudent()" class="w-full bg-blue-700 text-white p-2 rounded font-bold hover:bg-blue-800">حفظ بيانات الطالب</button>
            </div>

            <!-- السجل المالي -->
            <div class="bg-green-50 p-4 rounded-lg border border-green-200 no-print space-y-3">
                <h2 class="font-bold text-lg text-green-900">رصد / تحديث الرسوم المالية</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <input type="text" id="fCode" placeholder="كود الطالب" class="p-2 border rounded">
                    <input type="number" id="fTotal" placeholder="إجمالي الرسوم" class="p-2 border rounded">
                    <input type="number" id="fPaid" placeholder="المبلغ المدفوع" class="p-2 border rounded">
                </div>
                <button onclick="saveFee()" class="w-full bg-green-700 text-white p-2 rounded font-bold hover:bg-green-800">حفظ السجل المالي</button>
            </div>

            <!-- عرض الطباعة والتقارير -->
            <div class="flex flex-wrap justify-between items-center gap-2 no-print">
                <button onclick="loadAllStudents()" class="bg-gray-800 text-white px-4 py-2 rounded font-bold hover:bg-gray-900">عرض كشف الطلاب المسجلين</button>
                <button onclick="window.print()" class="bg-red-600 text-white px-4 py-2 rounded font-bold hover:bg-red-700">تصدير / حفظ PDF 📄</button>
            </div>
            
            <div id="allStudentsTable" class="mt-4 hidden">
                <h3 class="font-bold text-md mb-2 text-center text-gray-800">كشف أسماء الطلاب والبيانات المسجلة</h3>
                <div class="overflow-x-auto">
                    <table class="w-full border-collapse border border-gray-300 text-right text-sm">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="border border-gray-300 p-2">الكود</th>
                                <th class="border border-gray-300 p-2">الاسم</th>
                                <th class="border border-gray-300 p-2">الصف</th>
                                <th class="border border-gray-300 p-2">الهاتف</th>
                            </tr>
                        </thead>
                        <tbody id="studentsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ==================== 2. لوحة المعلم ==================== -->
        <div id="tab-teacher" class="tab-content hidden space-y-4 no-print">
            <h2 class="font-bold text-lg text-gray-800">رصد التقييم الأكاديمي والحضور</h2>
            <input type="text" id="tCode" placeholder="كود الطالب" class="w-full p-2 border rounded">
            <input type="text" id="tSubject" placeholder="المادة الدراسية" class="w-full p-2 border rounded">
            <input type="number" id="tScore" placeholder="الدرجة" class="w-full p-2 border rounded">
            <select id="tStatus" class="w-full p-2 border rounded">
                <option value="حاضر">حاضر</option>
                <option value="غائب">غائب</option>
                <option value="مستأذن">مستأذن</option>
            </select>
            <input type="text" id="tNotes" placeholder="ملاحظات سلوكية / تعليمية" class="w-full p-2 border rounded">
            <button onclick="saveTeacherRecord()" class="w-full bg-emerald-600 text-white p-2 rounded font-bold hover:bg-emerald-700">رصد وحفظ التقرير</button>
        </div>

        <!-- ==================== 3. لوحة الطالب وولي الأمر ==================== -->
        <div id="tab-student" class="tab-content hidden space-y-4">
            <h2 class="font-bold text-lg text-gray-800 no-print">استعلام ومتابعة ملف الطالب</h2>
            <div class="flex gap-2 no-print">
                <input type="text" id="sCode" placeholder="أدخل كود الطالب" class="w-full p-2 border rounded">
                <button onclick="fetchStudentFullReport()" class="bg-indigo-600 text-white px-6 py-2 rounded font-bold hover:bg-indigo-700 whitespace-nowrap">عرض</button>
            </div>
            
            <div id="studentReportArea" class="hidden space-y-4 border-t pt-4">
                <div id="studentBasicInfo" class="p-4 bg-blue-50 border rounded"></div>
                
                <h3 class="font-bold text-md text-gray-800">الدرجات والملاحظات السلوكية</h3>
                <div class="overflow-x-auto">
                    <table class="w-full border-collapse border border-gray-300 text-right text-sm">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="border border-gray-300 p-2">المادة</th>
                                <th class="border border-gray-300 p-2">الدرجة</th>
                                <th class="border border-gray-300 p-2">الحضور</th>
                                <th class="border border-gray-300 p-2">الملاحظات</th>
                            </tr>
                        </thead>
                        <tbody id="studentGradesBody"></tbody>
                    </table>
                </div>

                <div id="studentFeeInfo" class="p-4 bg-green-50 border rounded"></div>

                <button onclick="window.print()" class="w-full bg-red-600 text-white p-2 rounded font-bold no-print hover:bg-red-700">حفظ التقرير PDF 📄</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://axhddoktuhjhscovstbr.supabase.co';
        const supabaseKey = 'sb_publishable_3D1Z7yd_R7r_VkvmYjo3ng_oe2VmNG_';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabName).classList.remove('hidden');

            document.querySelectorAll('.flex button').forEach(el => {
                el.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                el.classList.add('text-gray-500');
            });
            document.getElementById('btn-' + tabName).classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
            document.getElementById('btn-' + tabName).classList.remove('text-gray-500');
        }

        // إضافة طالب جديد
        async function addStudent() {
            const code = document.getElementById('addCode').value.trim();
            const name = document.getElementById('addName').value.trim();
            const grade = document.getElementById('addGrade').value.trim();
            const phone = document.getElementById('addPhone').value.trim();

            if (!code || !name) { alert('يرجى إدخال الكود والاسم'); return; }

            const { error } = await supabaseClient
                .from('student')
                .insert([{ id: code, name: name, grade: grade, phone: phone }]);

            if (error) { alert('خطأ أثناء الحفظ: ' + error.message); } 
            else {
                alert('تم حفظ الطالب بنجاح!');
                document.getElementById('addCode').value = '';
                document.getElementById('addName').value = '';
                document.getElementById('addGrade').value = '';
                document.getElementById('addPhone').value = '';
            }
        }

        // حفظ الرسوم المالية
        async function saveFee() {
            const code = document.getElementById('fCode').value.trim();
            const total = document.getElementById('fTotal').value;
            const paid = document.getElementById('fPaid').value;

            if (!code) { alert('أدخل كود الطالب'); return; }

            const { error } = await supabaseClient
                .from('fees')
                .insert([{ student_id: code, total_fee: total, paid_fee: paid }]);

            if (error) { alert('خطأ أثناء الرصد المالي: ' + error.message); } 
            else {
                alert('تم حفظ البيانات المالية بنجاح!');
                document.getElementById('fCode').value = '';
                document.getElementById('fTotal').value = '';
                document.getElementById('fPaid').value = '';
            }
        }

        // عرض قائمة الطلاب
        async function loadAllStudents() {
            const { data, error } = await supabaseClient.from('student').select('*');
            if (error) { alert('خطأ: ' + error.message); return; }

            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '';
            if (data && data.length > 0) {
                data.forEach(s => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="border border-gray-300 p-2">${s.id || ''}</td>
                            <td class="border border-gray-300 p-2">${s.name || ''}</td>
                            <td class="border border-gray-300 p-2">${s.grade || ''}</td>
                            <td class="border border-gray-300 p-2">${s.phone || ''}</td>
                        </tr>`;
                });
                document.getElementById('allStudentsTable').classList.remove('hidden');
            } else { alert('لا يوجد طلاب مسجلون'); }
        }

        // رصد المعلم
        async function saveTeacherRecord() {
            const code = document.getElementById('tCode').value.trim();
            const subject = document.getElementById('tSubject').value.trim();
            const score = document.getElementById('tScore').value;
            const status = document.getElementById('tStatus').value;
            const notes = document.getElementById('tNotes').value.trim();

            if (!code || !subject) { alert('أدخل كود الطالب والمادة'); return; }

            const { error } = await supabaseClient
                .from('grades')
                .insert([{ student_id: code, subject: subject, score: score, status: status, notes: notes }]);

            if (error) { alert('خطأ في الرصد: ' + error.message); } 
            else {
                alert('تم رصد التقرير بنجاح!');
                document.getElementById('tCode').value = '';
                document.getElementById('tSubject').value = '';
                document.getElementById('tScore').value = '';
                document.getElementById('tNotes').value = '';
            }
        }

        // جلب تقرير الطالب المكتمل
        async function fetchStudentFullReport() {
            const code = document.getElementById('sCode').value.trim();
            if (!code) { alert('يرجى إدخال كود الطالب'); return; }

            // جلب البيانات الأساسية
            const { data: student } = await supabaseClient.from('student').select('*').eq('id', code).maybeSingle();
            
            if (!student) { alert('لم يتم العثور على طالب بهذا الكود!'); return; }

            // جلب الدرجات والحضور
            const { data: grades } = await supabaseClient.from('grades').select('*').eq('student_id', code);
            
            // جلب الرسوم
            const { data: fees } = await supabaseClient.from('fees').select('*').eq('student_id', code).order('id', { ascending: false }).limit(1).maybeSingle();

            // عرض البيانات الأساسية
            document.getElementById('studentBasicInfo').innerHTML = `
                <p><b>كود الطالب:</b> ${student.id}</p>
                <p><b>الاسم:</b> ${student.name || 'غير محدد'}</p>
                <p><b>الصف الدراسي:</b> ${student.grade || 'غير محدد'}</p>
                <p><b>رقم التواصل:</b> ${student.phone || 'غير محدد'}</p>
            `;

            // عرض جدول الدرجات
            const tbody = document.getElementById('studentGradesBody');
            tbody.innerHTML = '';
            if (grades && grades.length > 0) {
                grades.forEach(g => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="border border-gray-300 p-2">${g.subject || '-'}</td>
                            <td class="border border-gray-300 p-2">${g.score !== null ? g.score : '-'}</td>
                            <td class="border border-gray-300 p-2">${g.status || '-'}</td>
                            <td class="border border-gray-300 p-2">${g.notes || '-'}</td>
                        </tr>`;
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="4" class="p-2 text-center text-gray-500">لا توجد سجلات أكاديمية مرصودة حتى الآن</td></tr>`;
            }

            // عرض الرسوم
            if (fees) {
                const remaining = (fees.total_fee || 0) - (fees.paid_fee || 0);
                document.getElementById('studentFeeInfo').innerHTML = `
                    <h4 class="font-bold mb-1 text-green-900">الموقف المالي:</h4>
                    <p><b>إجمالي الرسوم:</b> ${fees.total_fee || 0}</p>
                    <p><b>المبلغ المدفوع:</b> ${fees.paid_fee || 0}</p>
                    <p><b>المتبقي:</b> <span class="${remaining > 0 ? 'text-red-600 font-bold' : 'text-green-600 font-bold'}">${remaining}</span></p>
                `;
            } else {
                document.getElementById('studentFeeInfo').innerHTML = `<p class="text-gray-500">لا يوجد سجل مالي مرصود</p>`;
            }

            document.getElementById('studentReportArea').classList.remove('hidden');
        }
    </script>
</body>
</html>
